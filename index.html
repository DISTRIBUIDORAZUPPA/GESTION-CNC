:root{
  color-scheme: light;
  --paper:#F4F3FA; --panel:#FFFFFF; --panel-2:#F1EFF9; --rule:#E5E2F1; --rule-2:#CFCAE3;
  --ink:#141B34; --ink-2:#4A5070; --ink-3:#7C8199;
  --accent:#6C4BD8; --accent-soft:#ECE7FC; --amber:#F08A24; --amber-soft:#FDEEDD;
  --good:#1E8E5A; --good-soft:#DDF3E8; --bad:#D23B4B; --bad-soft:#FBE1E4; --warn:#B86E06; --warn-soft:#FCEFD9;
  --s1:#0E9FB5; --s4:#F08A24; --s7:#6C4BD8; --s0:#9A9DB0; --s2:#E8505B; --s3:#1E8E5A;
  --m1:#E8505B; --m2:#7C4DC4; --m3:#E0A100;
  --h1:#FFC7BF; --h2:#F26B5B; --h3:#A51E3A;
  --side:#0F1B3D; --side-2:#1C2B57; --side-ink:#EDF0FB; --side-ink-2:#99A4C8; --side-accent:#FF8A5B;
  --grid:rgba(20,27,52,.07); --shadow:0 1px 2px rgba(20,27,52,.05),0 6px 18px rgba(20,27,52,.05);
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-pal]){
    color-scheme: dark;
    --paper:#0B1226; --panel:#141C36; --panel-2:#1B2544; --rule:#26304F; --rule-2:#36415F;
    --ink:#EEF0FA; --ink-2:#B3B9D3; --ink-3:#7F87A6;
    --accent:#8B72EE; --accent-soft:#252B55; --amber:#F29B45; --amber-soft:#3A2A1A;
    --good:#4CC38A; --good-soft:#15352A; --bad:#F07480; --bad-soft:#3E1C24; --warn:#E6A33E; --warn-soft:#3A2C14;
    --s1:#1C9AAD; --s4:#C8741F; --s7:#8B72EE; --s0:#6F7591; --s2:#E0606B; --s3:#4CC38A;
    --m1:#E0606B; --m2:#9E7BE4; --m3:#AE820A;
    --h1:#5A2330; --h2:#C04A45; --h3:#FF9C8A;
    --side:#070D1F; --side-2:#16214A;
    --grid:rgba(238,240,250,.08); --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0B1226; --panel:#141C36; --panel-2:#1B2544; --rule:#26304F; --rule-2:#36415F;
  --ink:#EEF0FA; --ink-2:#B3B9D3; --ink-3:#7F87A6;
  --accent:#8B72EE; --accent-soft:#252B55; --amber:#F29B45; --amber-soft:#3A2A1A;
  --good:#4CC38A; --good-soft:#15352A; --bad:#F07480; --bad-soft:#3E1C24; --warn:#E6A33E; --warn-soft:#3A2C14;
  --s1:#1C9AAD; --s4:#C8741F; --s7:#8B72EE; --s0:#6F7591; --s2:#E0606B; --s3:#4CC38A;
  --m1:#E0606B; --m2:#9E7BE4; --m3:#AE820A;
  --h1:#5A2330; --h2:#C04A45; --h3:#FF9C8A;
  --side:#070D1F; --side-2:#16214A;
  --grid:rgba(238,240,250,.08); --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.015em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* barra lateral */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:var(--side-ink);padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;scrollbar-width:thin}
.brand .code{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--side);background:var(--side-accent);padding:2px 8px;border-radius:999px;letter-spacing:.06em;margin-bottom:10px}
.brand h1{font-size:22px;line-height:1.15;color:var(--side-ink)}
.brand .sub{color:var(--side-ink-2);font-size:11.5px;margin-top:6px;line-height:1.45}
.side-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-ink-2);font-weight:700;margin:0 0 6px 6px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--side-ink-2);font-weight:600;font-size:13.5px;text-align:left}
.tab svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.tab[aria-selected="true"]{background:var(--side-2);color:#fff}
.tab[aria-selected="true"] svg{stroke:var(--side-accent)}
.side .filters{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.side .f label{color:var(--side-ink-2)}
.side .f select{background-color:var(--side-2);border-color:transparent;color:var(--side-ink);width:100%}
.side .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:0;background:transparent;height:auto;overflow:visible}
.side .seg button{height:32px;border-radius:7px;background:var(--side-2);color:var(--side-ink-2);border:0!important;font-size:12.5px;padding:0 4px}
.side .seg button[aria-pressed="true"]{background:var(--side-accent);color:var(--side)}
.side .user{font-size:12px;color:var(--side-ink-2);margin-top:auto;border-top:1px solid var(--side-2);padding-top:12px}
.side .user a{color:var(--side-ink)}

.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.f select,.f input,.f textarea{background:var(--panel);border:1px solid var(--rule-2);border-radius:8px;padding:6px 10px;height:36px;max-width:100%}
.f select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 16px,calc(100% - 9px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.f textarea{height:auto;min-height:64px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;height:36px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:0 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--rule-2);background:var(--panel);border-radius:8px;height:36px;padding:0 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.filters-main{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}

.wrap{min-width:0;padding-inline:clamp(16px,2.4vw,40px);padding-block:26px 64px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sec-h h2{font-size:21px}
.sec-h p{margin:0;color:var(--ink-2);max-width:78ch}
.hint{color:var(--ink-3);font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{font-size:16px;margin-bottom:2px}
.panel .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--panel-2);color:var(--ink-2)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

.dd.c2{background:color-mix(in srgb,var(--accent) 58%,var(--panel));color:#fff;font-weight:700}
.dd.c3{background:var(--accent);color:#fff;font-weight:700}
.dd.ot::after{content:'';position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink-3)}
.dd.rec{box-shadow:inset 0 0 0 2px var(--good)}
.dd.hoy{text-decoration:underline;text-underline-offset:2px}
.dd.sel{outline:2px solid var(--ink)}
.mmleg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.mmleg i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--panel-2)}
.mmleg i.c1{background:color-mix(in srgb,var(--accent) 30%,var(--panel))}.mmleg i.c2{background:color-mix(in srgb,var(--accent) 58%,var(--panel))}.mmleg i.c3{background:var(--accent)}
.mmleg i.ot{background:var(--panel-2);box-shadow:inset 0 -4px 0 -2px var(--ink-3)}.mmleg i.rec{box-shadow:inset 0 0 0 2px var(--good)}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.vcard{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--panel)}
.vcard.ok{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.vcard p{margin:4px 0;font-size:13px}
.vcard .vt{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.vh{display:flex;align-items:center;gap:6px}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.sugc{text-align:left;border:1px solid var(--rule-2);background:var(--panel);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;cursor:pointer}
.sugc:hover,.sugc.on{border-color:var(--good);background:var(--good-soft)}

.chip.asg{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);border:1px dashed var(--good)}
.vcard.asg{border-style:dashed;border-color:var(--good)}
.dd.asg{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--good) 55%,transparent);outline:1px dashed var(--good);outline-offset:-3px}
.mmleg i.asg{outline:1px dashed var(--good);outline-offset:-3px}
/* ===== cronología U3M → U6M → U12M ===== */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-t h2{font-size:28px;line-height:1.15}
.hero-t p{margin:4px 0 0;color:var(--ink-2);max-width:80ch}
.eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.crono{display:grid;grid-template-columns:1fr 36px 1fr 36px 1fr;align-items:stretch}
.cn{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:4px 14px;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;
  background:var(--panel);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.cn::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.cn:hover{transform:translateY(-2px)}
.cn.on{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel) 70%);box-shadow:0 0 0 2px var(--c),var(--shadow)}
.cn-dot{grid-row:1/3;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;align-content:center;background:color-mix(in srgb,var(--c) 26%,transparent);border:2px solid var(--c)}
.cn-dot b{font-family:var(--f-display);font-size:22px;line-height:1}
.cn-dot i{font-style:normal;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.cn-body{display:flex;flex-direction:column;min-width:0}
.cn-lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.cn-v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.cn-p{font-size:12.5px;color:var(--ink-2)}
.cn .spk{grid-column:2;width:100%;height:34px}
.cn-arrow{align-self:center;justify-self:center;width:36px;height:2px;background:repeating-linear-gradient(90deg,var(--rule-2) 0 6px,transparent 6px 10px);position:relative}
.cn-arrow::after{content:'';position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left-color:var(--rule-2)}
.dl{font-size:12px;font-weight:600}
.dl.up{color:var(--bad)} .dl.dn{color:var(--good)} .dl.eq{color:var(--ink-3)}
.g-crono{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1100px){ .g-crono{grid-template-columns:1fr} .crono{grid-template-columns:1fr;gap:10px} .cn-arrow{transform:rotate(90deg);height:2px} }
.spvc{display:flex;flex-direction:column;gap:10px}
.spv-card{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:12px;border-radius:14px;background:var(--panel-2)}
.spv-card .av{width:40px;height:40px}
.spv-card>div:first-of-type{display:flex;flex-direction:column}
.spv-n{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);font-family:var(--f-display);font-weight:700;font-size:17px}
.pill i{font-style:normal;font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.pill.on{background:var(--c);color:var(--on-c,#fff)} .pill.on i{color:inherit;opacity:.85}
.pvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:18px}
.pv-sup{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pv-row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(80px,1.4fr) 62px 90px 44px;gap:10px;align-items:center;padding:7px 8px;border-radius:12px;cursor:pointer}
.pv-row:hover{background:var(--panel-2)}
.pv-n{display:flex;align-items:center;min-width:0}
.pv-n>span{display:flex;flex-direction:column;min-width:0}
.pv-n i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.pv-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
.pv-bar i{display:block;height:100%}
.pv-v{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.pv-v b{font-family:var(--f-display);font-size:19px}
.pv-v i{font-style:normal;font-size:11px;color:var(--ink-3)}
.pv-d .dl{font-size:11px}
/* números y tablas con la fuente del cuerpo (más amable que la monoespaciada) */
.mono,.num,td.n,th.n{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.kpi .v,.cn-v,.pill,h2{letter-spacing:-.02em}

/* ===== paletas de prueba ===== */
:root[data-pal="oliva"]{color-scheme:light;
  --paper:#F3EEE2;--panel:#FFFDF8;--panel-2:#EFE8D8;--rule:#E3D9C4;--rule-2:#C9BB9C;
  --ink:#2F3E2E;--ink-2:#5B6650;--ink-3:#8A8A72;--accent:#556B2F;--accent-soft:#E4E9D3;
  --good:#556B2F;--good-soft:#E4E9D3;--bad:#A8432A;--bad-soft:#F4E0D7;--warn:#9C6B1F;--warn-soft:#F3E6CC;--amber:#B07A3A;--amber-soft:#F3E6CC;
  --s7:#2F3E2E;--s4:#B07A3A;--s1:#8A9A5B;--s0:#A9A38E;--s2:#A8432A;--s3:#556B2F;--m1:#A8432A;--m2:#556B2F;--m3:#C9A15B;
  --h1:#C9B48F;--h2:#A0683F;--h3:#6B3A1F;--side:#2F3E2E;--side-2:#3F523D;--side-ink:#F3EEE2;--side-ink-2:#B9BFA6;--side-accent:#E7DDC8;
  --grid:rgba(47,62,46,.08);--shadow:0 1px 2px rgba(47,62,46,.06),0 8px 22px rgba(47,62,46,.07);
  --f-display:"Fraunces",Georgia,serif;--f-body:"Work Sans",system-ui,sans-serif}
.kpi:not(:has(.tx)){flex-direction:column;align-items:flex-start;gap:2px}
.kpi .v{white-space:nowrap}
.brand-logos{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.brand-logos{gap:14px}
.lg-zuppa{height:62px;width:auto;display:block}
.lg-card{display:inline-grid;place-items:center;height:62px;padding:6px 10px;border-radius:12px;background:#FFFDF8;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lg-card img{height:50px;width:auto;display:block}
.btn-clear{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--side-ink) 25%,transparent);background:transparent;color:var(--side-ink);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn-clear:hover{background:var(--side-2)}
.btn-clear svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

const mesLL = ym => { if(!ym) return ''; const [y,m]=ym.split('-'); return MES_LL[+m-1]+' '+y; };

function sumaMes(ym,k){ let [y,m]=ym.split('-').map(Number); m=m-1+k; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ====================== lógica de horizontes ====================== */
let M=[], MI=0;
function serie(c,un){ return c[UNS[un||S.un].k] || null; }
function elegible(c,k){ if(S.crit==='excel') return true; if(!c.alta) return true; const ini=M[MI-k]; return !ini || c.alta.slice(0,7)<=ini; }
function excluidoTexto(c,un){ return S.crit==='excel' && (c.tx||'').includes(UNS[un||S.un].tx); }
function sinCompra(s,k,hasta){ const h = hasta==null?MI:hasta; for(let j=1;j<=k;j++){ const i=h-j; if(i<0) return false; if(s[i]>0) return false; } return true; }
function flags(c,un){
  const s=serie(c,un); if(!s) return null;
  const tx=excluidoTexto(c,un);
  const f={ ma: !tx && s[MI]<=0 };
  [['u1',1],['u2',2],['u3',3],['u6',6],['u9',9],['u12',12]].forEach(([n,k])=>{ f[n]= !tx && sinCompra(s,k) && elegible(c,k); });
  let m=0; for(let i=MI-1;i>=0 && s[i]<=0;i--) m++; f.meses = m>=MI ? MI : m; f.nunca = m>=MI;
  f.bucket = f.u12 ? 3 : f.u6 ? 2 : f.u3 ? 1 : 0;
  return f;
}
function horizonteLab(f){ return !f ? '–' : f.u12 ? 'U12M' : f.u6 ? 'U6M' : f.u3 ? 'U3M' : (f.u1 ? 'Últ. mes' : 'Compra'); }
function volPrevio(s){ let t=0,n=0; for(let i=0;i<MI;i++){ if(s[i]>0){ t+=s[i]; n++; } } return n? t/n : 0; }
function clientesFiltrados(){
  return D.data.clientes.filter(c => (!S.spv || c.spv===S.spv) && (!S.pv || c.pv===S.pv));
}
function ultimoMotivo(cod){ return MOT_IDX[cod] || null; }
let MOT_IDX = {};

/* ====================== carga ====================== */
async function cargar(){
  const r = await fetch('data.json',{cache:'no-store'});
  D.data = await r.json();
  M = D.data.meta.meses; MI = M.length-1;
  D.api = D.data.meta.api || '';
  // agenda de supervisores guardada en el tablero (13/10/2026): se usa si la planilla todavía no la manda
  if(!(D.data.agenda||[]).length){ try{ const af=JSON.parse(document.getElementById('agendaFija').textContent); D.data.agenda=af.registros||[]; D.agendaFija=af.fecha; }catch(e){} }
  // índice de último motivo por cliente (UN > TOTAL)
  const push=(b,src)=>b.regs.forEach(r=>{ const prev=MOT_IDX[r.cod]; if(!prev || prev.fecha<=r.fecha) MOT_IDX[r.cod]={...r, mes:b.mes, src}; });
  D.data.motivos.total.forEach(b=>push(b,'TOTAL'));
  D.data.motivos.un.forEach(b=>push(b,'UN'));
  try{ const rf=await fetch('fotos.json',{cache:'no-store'}); if(rf.ok) FOTOS=await rf.json(); }catch(e){}
  D.data.clientes.forEach(c=>CLI[c.cod]=c);
  initUser(); initFiltros();
  $('#subTitle').textContent = `Datos al ${D.data.meta.generado} · mes en curso ${mesLL(D.data.meta.mesActual)} (parcial) · U3M = sin compra en ${mesLab(M[MI-3])}, ${mesLab(M[MI-2])} y ${mesLab(M[MI-1])}`;
  await cargarVisitas();
  await cargarPlanes();
  render();
}
async function cargarVisitas(){
  if(!D.api){ D.visitas = lsGet('gcnc_visitas_local',[]); D.visitasLocal=true; return; }
  try{
    const r = await fetch(D.api+'?action=visitas',{cache:'no-store'});
    const j = await r.json(); D.visitas = j.visitas||[]; D.visitasLocal=false;
  }catch(e){ D.visitas = lsGet('gcnc_visitas_local',[]); D.visitasLocal=true; D.visitasError=true; }
}

async function cargarPlanes(){
  D.planes={};
  if(!D.api){ D.planes=lsGet('gcnc_planes_local',{}); D.planesLocal=true; return; }
  try{ const r=await fetch(D.api+'?action=planes',{cache:'no-store'}); const j=await r.json(); (j.planes||[]).forEach(x=>D.planes[x.id]=x); D.planesLocal=false; }
  catch(e){ D.planes=lsGet('gcnc_planes_local',{}); D.planesLocal=true; D.planesError=true; }
}
async function guardarPlan(pl){
  if(!D.api){ D.planes[pl.id]=pl; lsSet('gcnc_planes_local',D.planes); return; }
  const r=await fetch(D.api,{method:'POST',body:JSON.stringify({action:'guardarPlan',plan:pl})}); const j=await r.json();
  if(!j.ok) throw new Error(j.error||'error de la planilla'); D.planes[pl.id]=j.plan||pl;
}

  const scope = p.get('scope')||''; const rol = p.get('rol')||'';
  if(spv && scope==='own'){ S.user={name:spv, spv:spv.split(' ')[0], scope:'own'}; }
  else if(scope==='all' && rol && rol!=='liderbb'){ S.user={name: rol==='gerencia'?'GERENCIA':'JEFE DE VENTAS', spv:'', scope:'all', lectura: rol==='gerencia'}; }
  else { const u=(()=>{try{return JSON.parse(sessionStorage.getItem('gcncUser')||'null');}catch(e){return null;}})(); if(u) S.user=u; }

function initFiltros(){
  const spvs=[...new Set(D.data.clientes.map(c=>c.spv))].sort();
  const fs=$('#fSpv');
  const locked = S.user && S.user.scope==='own';
  fs.innerHTML = (locked?'':'<option value="">Todos</option>') + spvs.filter(s=>!locked||s===S.spv).map(s=>`<option ${s===S.spv?'selected':''}>${esc(s)}</option>`).join('');
  fs.disabled = locked;
  fillPv();
  fs.onchange=()=>{ S.spv=fs.value; S.pv=''; fillPv(); render(); };
  $('#fPv').onchange=()=>{ S.pv=$('#fPv').value; render(); };
  $('#fClear').onclick=limpiarFiltros;
  $('#fCrit').value=S.crit; $('#fCrit').onchange=()=>{ S.crit=$('#fCrit').value; render(); };
  document.querySelectorAll('#fUn button').forEach(b=>b.onclick=()=>{ S.un=b.dataset.v; document.querySelectorAll('#fUn button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
  document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>irTab(t.dataset.t));

function limpiarFiltros(){
  S.un='TOTAL'; if(!(S.user&&S.user.scope==='own')) S.spv=''; S.pv=''; S.crit='aud';

  if(typeof MP!=='undefined') Object.assign(MP,{hz:'cnc',acum:false});

}
function fillPv(){
  const pvs=[...new Set(D.data.clientes.filter(c=>!S.spv||c.spv===S.spv).map(c=>c.pv))].sort();
  $('#fPv').innerHTML='<option value="">Todos</option>'+pvs.map(p=>`<option ${p===S.pv?'selected':''}>${esc(p)}</option>`).join('');

function irTab(t){
  S.tab=t; document.querySelectorAll('#tabs .tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.t===t));
  document.querySelectorAll('main > .view').forEach(v=>v.hidden = v.id!=='v-'+t);

/* ====================== charts ====================== */
const CH = {};
function chart(id,cfg){
  if(CH[id]) CH[id].destroy();
  const el=document.getElementById(id); if(!el) return;
  Chart.defaults.font.family = cssv('--f-body') || 'system-ui';
  Chart.defaults.animation = false;
  Chart.defaults.color = cssv('--ink-2');
  Chart.defaults.borderColor = cssv('--grid');
  const o=cfg.options||{}; const pl=o.plugins||{};
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}}, o);
  cfg.options.plugins = Object.assign({}, pl, {legend:{display:false}, tooltip:Object.assign({backgroundColor:cssv('--ink'), titleColor:cssv('--paper'), bodyColor:cssv('--paper'), padding:10, cornerRadius:6}, pl.tooltip||{})});
  CH[id] = new Chart(el, cfg);
}
function legend(items){ return `<div class="legend">${items.map(([l,c])=>`<span><i class="dot" style="background:var(${c})"></i>${esc(l)}</span>`).join('')}</div>`; }
function heatBg(x, max, varName){ if(!x||!max) return ''; const a=Math.min(1,x/max); return `background:color-mix(in srgb, var(${varName||'--h2'}) ${Math.round(a*55)}%, transparent)`; }
function spark(s){
  const mx=Math.max(...s.map(v=>v>0?v:0),0.0001);
  return `<span class="spark" title="${s.map((v,i)=>mesLab(M[i])+': '+n2(v)).join(' · ')}">`+s.map((v,i)=>`<i class="${v>0?'':'z'} ${i===MI?'cur':''}" style="height:${v>0?Math.max(2,Math.round(v/mx*18)):2}px"></i>`).join('')+'</span>';
}

/* ---------- agregados por promotor ---------- */
function tablaHorizonte(un){
  const rows={}; const tot={};
  clientesFiltrados().forEach(c=>{
    const f=flags(c,un); if(!f) return;
    const key=c.spv+'|'+c.pv;
    const r = rows[key] || (rows[key]={spv:c.spv,pv:c.pv,cart:0,ma:0,u1:0,u2:0,u3:0,u6:0,u9:0,u12:0,compra:0,x3:0,x6:0,x9:0,x12:0});
    r.cart++; ['ma','u1','u2','u3','u6','u9','u12'].forEach(k=>{ if(f[k]) r[k]++; }); if(serie(c,un)[MI]>0) r.compra++;
    if(f.u3&&!f.u6) r.x3++; else if(f.u6&&!f.u9) r.x6++; else if(f.u9&&!f.u12) r.x9++; else if(f.u12) r.x12++;
  });
  return Object.values(rows).sort((a,b)=>a.spv.localeCompare(b.spv)||a.pv.localeCompare(b.pv));
}
function sumRows(rs,label){ const o={pv:label,cart:0,ma:0,u1:0,u2:0,u3:0,u6:0,u9:0,u12:0,compra:0,x3:0,x6:0,x9:0,x12:0}; rs.forEach(r=>Object.keys(o).forEach(k=>{ if(k!=='pv') o[k]+=r[k]; })); return o; }
function totalesUn(un){ const rs=tablaHorizonte(un); return sumRows(rs,'ZUPPA'); }

function datosAud(){
  const T={}; ['TOTAL','CVZA','NABS'].forEach(u=>T[u]=totalesUn(u));
  const u12=clientesFiltrados().filter(c=>{const f=flags(c,'TOTAL'); return f&&f.u12;});
  const mt=D.data.motivos.total.filter(b=>!b.pendiente), mu=D.data.motivos.un;
  const mesesRel=[...new Set([...mt,...mu].filter(b=>b.regs.length).map(b=>b.mes))].sort();
  return { T, u12, frecOk:u12.filter(c=>c.per===4), frecQ:u12.filter(c=>c.per===2), frecMal:u12.filter(c=>c.per!==4&&c.per!==2),
    mesesRel, pend:D.data.motivos.total.filter(b=>b.pendiente).concat(D.data.motivos.un.filter(b=>b.pendiente)),
    relUnU: mu.reduce((a,b)=>a+b.regs.filter(enFiltro).length,0), relTot: mt.reduce((a,b)=>a+b.regs.filter(enFiltro).length,0) };
}

/* ====================== CONTROL AUDITORÍA ====================== */
function rAuditoria(){
  const v=$('#v-auditoria');
  const A=datosAud(), T=A.T;

function enFiltro(r){ if(!S.spv && !S.pv) return true; const pv=r.pv || (CLI[r.cod]||{}).pv; const spv=(CLI[r.cod]||{}).spv || spvDe(pv); return (!S.pv||pv===S.pv) && (!S.spv||spv===S.spv); }

function reconciliacion(){
  // diferencias entre criterio auditoría y Excel (solo se muestra en criterio auditoría)
  const un=S.un, k=UNS[un].tx;
  const cs=clientesFiltrados();
  let tx=0, nuevos=0;
  const save=S.crit;
  S.crit='aud'; const aud=cs.filter(c=>{const f=flags(c,un);return f&&f.u3;}); S.crit='excel'; const exc=cs.filter(c=>{const f=flags(c,un);return f&&f.u3;}); S.crit=save;
  const setA=new Set(aud.map(c=>c.cod)), setE=new Set(exc.map(c=>c.cod));
  aud.forEach(c=>{ if(!setE.has(c.cod)) tx++; }); exc.forEach(c=>{ if(!setA.has(c.cod)) nuevos++; });
  if(!tx && !nuevos) return '';
  return `<div class="note"><b>Diferencia con el Excel (U3M ${UNS[un].lab}): tablero ${n0(aud.length)} vs Excel ${n0(exc.length)}.</b>

    ${nuevos?` Se sacan ${n0(nuevos)} altas nuevas: todavía no tenían los 3 meses en cartera cuando empezó la ventana.`:''}
    Con "Criterio de conteo → Igual al Excel" ves los números de tu planilla.</div>`;
}

const HZ2={k:'u3'};
const HZK={u3:{lab:'U3M',meses:3,txt:'3 meses sin compra',col:'--h1'},u6:{lab:'U6M',meses:6,txt:'6 meses sin compra',col:'--h2'},u12:{lab:'U12M',meses:12,txt:'12 meses sin compra',col:'--h3'}};
// ¿el cliente estaba en el horizonte k al mes m? (mismo criterio que el resto del tablero)
function enHzMes(c,un,m,k){ const s=serie(c,un); if(!s||excluidoTexto(c,un)) return false; if(m-k<0) return false;
  if(!sinCompra(s,k,m)) return false; if(S.crit==='aud' && c.alta && c.alta.slice(0,7)>M[m-k]) return false; return true; }
function hzSerie(cs,un,k,desde){ const out=[]; for(let m=desde;m<=MI;m++) out.push(m-HZK[k].meses<0?null:cs.filter(c=>enHzMes(c,un,m,HZK[k].meses)).length); return out; }
function sparkSvg(vals,col,w=120,h=34){
  const v=vals.map(x=>x==null?null:x), ok=v.filter(x=>x!=null); if(ok.length<2) return '';
  const mx=Math.max(...ok), mn=Math.min(...ok), r=mx-mn||1, n=v.length;
  const pts=v.map((x,i)=>x==null?null:[i/(n-1)*w, h-4-(x-mn)/r*(h-8)]).filter(Boolean);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const a=d+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const id='g'+Math.random().toString(36).slice(2,8);

const HZS={modo:'acum', med:'n', cerr:{}};
function tablaHzNueva(rows){

  const mx={}; [...rec,...cnc].forEach(([k])=>mx[k]=Math.max(1,...rows.map(r=>pct? r[k]/Math.max(1,r.cart) : r[k])));
  const val=(r,k)=> pct ? pc(r[k]/Math.max(1,r.cart),1) : n0(r[k]);
  const cel=(r,k,col,cls)=>{ const x=pct? r[k]/Math.max(1,r.cart) : r[k]; const w=cls?0:Math.round(x/mx[k]*100); return `<td class="n bc ${cls||''}" style="--w:${w};--c:var(${col})"><span>${val(r,k)}</span></td>`; };

      <tbody>${body}</tbody></table></div></div>`;

function recupero(r,mes){
  const c=CLI[r.cod]; const idx=M.indexOf(mes);
  const un = r.un==='NABS'?'NABS':(r.un==='CVZA'?'CVZA':'TOTAL');
  if(c && idx>=0){ const s=serie(c,un); const sig = idx+1<=MI ? s[idx+1]>0 : null; let alDia=false; for(let i=idx+1;i<=MI;i++) if(s[i]>0) alDia=true; return {sig, alDia, fuente:'base'}; }
  const v = un==='NABS'? r.vN : un==='CVZA'? r.vC : ((r.vC||0)+(r.vN||0));
  return {sig: v==null?null: v>0, alDia: v>0, fuente:'hoja'};
}

/* ====================== PDA ====================== */
const PD={base:'TOTAL', vista:'motivo', un:'c', mes:'', mot:'', res:'', seg:'', q:'', pv:'', pag:0, abierto:null};

function bindVista(v){ v.querySelectorAll('#pdVista button').forEach(b=>b.onclick=()=>{PD.vista=b.dataset.v; rPda(); enviarAlto();}); }
function rPda(){
  if(PD.vista==='cliente') return rPdaCliente();

  const relBl = PD.base==='TOTAL'? D.data.motivos.total : D.data.motivos.un;
  v.innerHTML=`
  <div class="sec-h"><h2>Planes de acción (PDA) por motivo</h2><p>Cada PDA responde a los motivos relevados el mes anterior: el PDA de mayo trabaja sobre el relevamiento de abril. Se muestran la acción, el estado, la fecha límite y los clientes recuperados que informa la hoja, junto al recupero calculado con la facturación.</p></div>
  <div class="filters" style="padding:0">${segVista()}<div class="f"><label>Base</label><div class="seg" id="pdBase"><button type="button" data-v="TOTAL" aria-pressed="${PD.base==='TOTAL'}">Total</button><button type="button" data-v="UN" aria-pressed="${PD.base==='UN'}">Por negocio</button></div></div></div>
  ${P.slice().reverse().map(p=>{
    const prev=sumaMes(p.mes,-1); const rb=relBl.find(b=>b.mes===prev);
    const regs = rb? rb.regs.filter(enFiltro):[];
    const recC = regs.filter(r=>{const c=CLI[r.cod]; if(!c) return false; const i=M.indexOf(p.mes); return i>=0 && i<=MI && (c.c||[])[i]>0;}).length;
    const recN = regs.filter(r=>{const c=CLI[r.cod]; if(!c) return false; const i=M.indexOf(p.mes); return i>=0 && i<=MI && (c.n||[])[i]>0;}).length;
    const recs=p.recuperados.filter(x=>(!S.pv||x.pv===S.pv)&&(!S.spv||x.pv===S.spv||spvDe(x.pv)===S.spv||x.pv==='ZUPPA'&&!S.pv&&!S.spv));
    return `<div class="panel"><div class="ph"><h3>PDA ${mesLL(p.mes)}</h3><span class="hint">sobre el relevamiento de ${mesLL(prev)}${rb?' · '+regs.length+' clientes relevados':''}</span></div>
    ${['cerveza','nabs'].map(sec=>p[sec].length?`<p class="hint" style="margin:6px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">PDA ${sec==='cerveza'?'Cerveza':'NABs'}</p>
      <div class="pda-sec">${evid(p.mes,sec)}<div class="tw"><table><thead><tr><th>Motivo</th><th class="n">Clientes</th><th>Acción</th><th>Estado</th><th>Fecha límite</th><th>Responsable</th></tr></thead><tbody>
      ${p[sec].map(x=>`<tr><td><span class="mk"><i class="dot" style="background:var(${MOT_COL[x.motivo]||'--s0'})"></i>${esc(x.motivo.toLowerCase())}</span></td><td class="n">${x.clientes??'–'}</td><td class="txt">${x.accion?esc(x.accion):'<span class="chip warn">sin acción cargada</span>'}</td><td>${stChip(x.status)}</td><td>${fDate(x.deadline)}</td><td>${esc(x.resp)}</td></tr>`).join('')}
      </tbody></table></div></div>`:'').join('')}
    ${recuperadosPanel(p, regs, recs)}

    </div>`;}).join('')}`;
  v.querySelectorAll('#pdBase button').forEach(b=>b.onclick=()=>{PD.base=b.dataset.v; rPda();});
  bindVista(v);
  v.querySelectorAll('.evid button').forEach(b=>b.onclick=()=>verImagen(b.dataset.src, b.dataset.cap));

/* ====================== PDA ÚLTIMOS 3 MESES · POR CLIENTE ====================== */
// Hoja PDA ULT 3 MESES ZUPPA: un plan por motivo para todos los CNC U3M del mes.
// Cada cliente viene marcado con su motivo en las columnas MOTIVO ULT 3 MESES <MES> de CCC TOTAL / CVZA / NABS.
const P3_UN={c:{sec:'CVZA',lab:'Cerveza',col:'--s4'},n:{sec:'NABS',lab:'NABs',col:'--s1'},t:{sec:'TOTAL',lab:'Total',col:'--s7'}};
const P3_MOTCOL={'PRECIO NO COMPETITIVOS':'--m1','DIFERENCIA DE PRECIOS':'--m2','COMPRA EN MAYORISTA':'--m3','CLIENTE POTENCIAL':'--s0'};
const PDC_EST=['Pendiente','En curso','Recuperado','No recuperado','Baja iniciada','Reprogramado'];
const PDC_ESTCL={'Pendiente':'','En curso':'warn','Recuperado':'ok','No recuperado':'bad','Baja iniciada':'bad','Reprogramado':'info'};
function pdcId(mes,cod){ return `PDA-${mes.slice(2,4)}${mes.slice(5,7)}-${cod}`; }
function pdcPuedeEditar(r){ return S.user && !S.user.lectura && (S.user.scope==='all' || S.user.spv===r.c.spv); }
function pdcChipSeg(r){ const e=r.ed; if(!e||!e.estado) return '<span class="hint">sin cargar</span>'; return `<span class="chip ${PDC_ESTCL[e.estado]||''}">${esc(e.estado)}</span>`; }
function p3Bloques(){ return (D.data.pda3||[]).filter(b=>M.indexOf(b.mes)>=3); }
function p3Motivo(code){ return (D.data.meta.motivosPda3||{})[code]||code; }
function p3Plan(b,un,motivo){ return b?(b[P3_UN[un].sec]||[]).find(x=>x.motivo===motivo)||null:null; }
function p3Equipo(c){ return (!S.spv||c.spv===S.spv)&&(!S.pv||c.pv===S.pv); }
function p3Filas(mes,un){
  const m=M.indexOf(mes), b=p3Bloques().find(x=>x.mes===mes), rows=[];
  D.data.clientes.forEach(c=>{
    const code=c.pm&&c.pm[un]&&c.pm[un][m]; if(!code) return;
    const s=c[un]||[]; const motivo=p3Motivo(code);
    let ms=0; for(let i=m-1;i>=0 && !(s[i]>0);i--) ms++;
    let luego=false; for(let i=m;i<=MI;i++) if(s[i]>0) luego=true;
    const plan=p3Plan(b,un,motivo);
    const r={c,motivo,plan,ms,nunca:ms>=m,hl:s[m]||0,compro:(s[m]||0)>0,luego,enCurso:m===MI};
    const e=(D.planes||{})[pdcId(mes,c.cod)]||null; r.ed=e; r.fecha=plan&&plan.deadline||''; r.fechaE=(e&&e.fecha)||r.fecha;
    rows.push(r);
  });
  return rows;
}
function p3ChipRes(r){ if(r.compro) return `<span class="chip ok">Compró</span>`; if(r.enCurso) return `<span class="chip">Sin compra aún</span>`; return `<span class="chip bad">No compró</span>`; }
function rPdaCliente(){

  const un=PD.un||'c';
  const conDatos=bl.filter(b=>D.data.clientes.some(c=>c.pm&&c.pm[un]&&c.pm[un][M.indexOf(b.mes)]));
  if(!PD.mes || !bl.some(b=>b.mes===PD.mes)) PD.mes=(conDatos.length?conDatos[conDatos.length-1]:bl[bl.length-1]).mes;
  const b=bl.find(x=>x.mes===PD.mes), m=M.indexOf(PD.mes), enCurso=m===MI;
  const todas=p3Filas(PD.mes,un), base=todas.filter(r=>p3Equipo(r.c));
  const q=PD.q.trim().toLowerCase();
  const rows=base.filter(r=>(!PD.mot||r.motivo===PD.mot)&&(!PD.pv||r.c.pv===PD.pv)
    &&(!PD.res||(PD.res==='si'?r.compro:PD.res==='luego'?(!r.compro&&r.luego):!r.compro&&!r.luego))
    &&(!PD.seg||(PD.seg==='-'?!(r.ed&&r.ed.estado):r.ed&&r.ed.estado===PD.seg))
    &&(!q||String(r.c.cod).includes(q)||(r.c.rs||'').toLowerCase().includes(q)||(r.c.dom||'').toLowerCase().includes(q)))
    .sort((a,b)=>a.c.pv.localeCompare(b.c.pv)||a.motivo.localeCompare(b.motivo)||a.ms-b.ms);
  const cnt=(a,f)=>a.filter(f).length;
  const sec=b?b[P3_UN[un].sec]||[]:[];
  const filtrado=!!(S.spv||S.pv);
  const motivos=[...new Set(sec.map(x=>x.motivo).concat(base.map(r=>r.motivo)))];
  const porMot={}; motivos.forEach(mo=>{ const rs=base.filter(r=>r.motivo===mo); porMot[mo]={n:rs.length,si:cnt(rs,r=>r.compro),al:cnt(rs,r=>r.compro||r.luego)}; });
  const realHoja=sec.reduce((t,x)=>t+(x.real||0),0), cliHoja=sec.reduce((t,x)=>t+(x.clientes||0),0);
  // efectividad por mes (con los filtros de equipo)
  const efe=bl.map(x=>{ const rs=p3Filas(x.mes,un).filter(r=>p3Equipo(r.c)); return {mes:x.mes,n:rs.length,si:cnt(rs,r=>r.compro),copia:x.copia,calc:x.calculado||((D.data.meta.pmAuto||{})[un]||[]).includes(M.indexOf(x.mes)),cur:x.mes===M[MI]}; });
  const maxN=Math.max(1,...efe.map(e=>e.n));
  // recuperados por promotor: hoja + facturación
  const uk=un==='t'?'t':un;
  const g={}; base.forEach(r=>{ const o=g[r.c.pv]||(g[r.c.pv]={pv:r.c.pv,spv:r.c.spv,n:0,si:0}); o.n++; if(r.compro) o.si++; });
  const hojaPv={}; (b?b.recuperados:[]).forEach(x=>hojaPv[x.pv]=x);
  const eq=Object.values(g).sort((a,b)=>b.si/b.n-a.si/a.n||b.n-a.n);
  const PAG=50, pages=Math.max(1,Math.ceil(rows.length/PAG)); if(PD.pag>=pages) PD.pag=0;
  const vis=rows.slice(PD.pag*PAG,(PD.pag+1)*PAG);
  const avisos=[];
  const auto=((D.data.meta.pmAuto||{})[un]||[]).includes(m);
  if(b&&b.calculado) avisos.push(`<b>Completado por el tablero.</b> En la hoja, el bloque de ${mesLL(PD.mes)} es copia del de ${mesLL(b.copia)}: clientes, real y recuperados se calcularon con las marcas y la venta de ${mesLab(PD.mes)}, con deadline ${fDate(sec[0]&&sec[0].deadline)}. La acción y el status son los de ${mesLab(b.copia)}.`);

function p3Csv(rows,mes,un){
  const head=['ID PDA','Mes','Negocio','Supervisor','Promotor','Codigo','Cliente','Domicilio','Localidad','Visita','Motivo','Meses sin compra','Accion del PDA','Estado en la hoja','Deadline','Responsable','Compro en el mes','HL del mes','Compro despues','Estado seguimiento','Accion acordada','Meta acordada HL','Fecha limite editada','Observaciones','Editado por','Actualizado'];
  const num=x=>x==null?'':String(Math.round(x*1000)/1000).replace('.',',');
  const lines=[head].concat(rows.map(r=>{ const c=r.c,e=r.ed||{}; return [pdcId(mes,c.cod),mes,P3_UN[un].lab,c.spv,c.pv,c.cod,c.rs,c.dom,c.loc,c.vis,r.motivo,r.nunca?r.ms+'+':r.ms,
    r.plan?r.plan.accion:'',r.plan?r.plan.status:'',r.fecha,r.plan?r.plan.resp:'',r.compro?'Sí':(r.enCurso?'Aún no':'No'),num(r.hl),(!r.compro&&r.luego)?'Sí':'',
    e.estado||'',e.accion||'',e.meta||'',e.fecha||'',e.obs||'',e.usuario||'',e.actualizado||'']; }));
  const csv='﻿'+lines.map(r=>r.map(x=>{const s=String(x==null?'':x); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`PDA_ult3meses_${P3_UN[un].sec}_${mes}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

function recuperadosPanel(p, regs, recs){
  const i=M.indexOf(p.mes); const enCurso=p.mes===M[MI];
  const hojaTiene=recs.some(x=>!x.total&&(x.realC!=null||x.realN!=null));
  let filas;
  if(hojaTiene){
    filas=recs.filter(x=>!x.total).map(x=>{ const n=x.cant!=null?x.cant:((x.nN||0)+(x.nC||0)); return {pv:x.pv, n, c:x.realC||0, nn:x.realN||0, bc:x.cant!=null?x.cant:(x.nC||0), bn:x.cant!=null?x.cant:(x.nN||0)}; });
  } else {
    const g={}; regs.forEach(r=>{ const c=CLI[r.cod]; const pv=r.pv||(c||{}).pv||'–'; const o=g[pv]||(g[pv]={pv,n:0,c:0,nn:0}); o.n++; if(c&&i>=0&&i<=MI){ if((c.c||[])[i]>0) o.c++; if((c.n||[])[i]>0) o.nn++; } });
    filas=Object.values(g).map(o=>({...o,bc:o.n,bn:o.n}));
  }
  if(!filas.length) return '';
  filas.sort((a,b)=>(b.c+b.nn)/Math.max(1,b.n)-(a.c+a.nn)/Math.max(1,a.n));
  const T=filas.reduce((t,x)=>({n:t.n+x.n,c:t.c+x.c,nn:t.nn+x.nn,bc:t.bc+x.bc,bn:t.bn+x.bn}),{n:0,c:0,nn:0,bc:0,bn:0});
  const row=(x,tot)=>`<div class="rc ${tot?'tot':''}"><span class="bn">${tot?'':avatar(x.pv,spvDe(x.pv))}<b>${tot?'Total':(x.pv==='–'?'Sin promotor (bajas)':esc(x.pv))}</b></span><span class="rn"><b>${x.n}</b> relevados</span>
    <span class="rb"><span class="rl">Cerveza</span>${barra(x.bc?x.c/x.bc:0,null,'--s4')}<b>${x.c}</b><span class="hint">${x.bc?pc(x.c/x.bc):'–'}</span></span>
    <span class="rb"><span class="rl">NABs</span>${barra(x.bn?x.nn/x.bn:0,null,'--s1')}<b>${x.nn}</b><span class="hint">${x.bn?pc(x.nn/x.bn):'–'}</span></span></div>`;
  return `<div class="recup"><div class="ph" style="margin:14px 0 6px"><h3 style="font-size:15px">Clientes recuperados en ${mesLL(p.mes)}</h3><span class="hint">${hojaTiene?'informado en la hoja':'calculado con la facturación'+(enCurso?' · mes en curso, se completa a fin de mes':'')}</span></div>
    ${row(T,true)}${filas.map(x=>row(x)).join('')}</div>`;
}
function evid(mes,sec){
  const ims=((D.data.evidencias||{})[mes]||{})[sec]||[];
  const cap=`Acción ${sec==='cerveza'?'Cerveza':'NABs'} · ${mesLL(mes)}`;
  if(!ims.length) return `<div class="evid vacia"><span class="hint">Sin imagen cargada. Subila a Drive como ${mes}_${sec==='cerveza'?'CERVEZA':'NABS'}.jpg</span></div>`;

function cncUnidades(c,ym){ const m=M.indexOf(ym); if(m<3) return []; return ['c','n','t'].filter(u=>c[u]&&[1,2,3].every(i=>!(c[u][m-i]>0))); }
function recCnc(c,ym,us){ const m=M.indexOf(ym); if(m<0) return null; for(let i=m;i<=MI;i++){ const b=us.filter(u=>(c[u]||[])[i]>0); if(b.length) return {mes:M[i],us:b}; } return null; }

function visItems(){
  const reg={}; D.visitas.forEach(x=>{ if(String(x.id).startsWith('AG-')) reg[x.id]=x; });
  const out=[];
  (D.data.agenda||[]).forEach(a=>{
    const r=reg[a.id]; const cod=(r&&r.cod)?+r.cod:a.cod;
    out.push({id:a.id,fecha:a.f,spv:a.s,cod:cod||null,cliente:(r&&r.cliente)||a.rs||(cod&&CLI[cod]?CLI[cod].rs:''),pv:(r&&r.pv)||a.pv||(cod&&CLI[cod]?CLI[cod].pv:''),
      tarea:a.t+(a.o?' · '+a.o:''),plan:(r&&r.plan)||a.p,nota:r?r.nota:'',causa:r?r.causa:'',resultado:r?r.resultado:'',estado:'Realizada',fuente:'agenda',registro:r||null,agenda:a});
  });
  D.visitas.forEach(x=>{ if(String(x.id).startsWith('AG-')) return; out.push({...x,cod:x.cod?+x.cod:null,tarea:'Visita a CNC (cargada en el tablero)',fuente:'tablero'}); });
  out.forEach(it=>{
    const c=it.cod?CLI[it.cod]:null; const ym=it.fecha.slice(0,7);
    it.cnc=c?cncUnidades(c,ym):[]; it.rec=it.cnc.length?recCnc(c,ym,it.cnc):null;
    it.esCnc=/NO COMPRADOR/i.test(it.tarea)||it.cnc.length>0||it.fuente==='tablero';
  });
  // control interno: a la visita CNC sin cliente se le asigna un CNC recuperado del equipo en ese mes (sin repetir cliente),
  // marcado como "asignado por el tablero" hasta que el supervisor lo confirme
  const usados={}, pool={};
  out.forEach(it=>{ if(it.cod) (usados[it.spv+'|'+it.fecha.slice(0,7)]||(usados[it.spv+'|'+it.fecha.slice(0,7)]=new Set())).add(it.cod); });
  out.filter(it=>it.esCnc&&!it.cod&&it.fuente==='agenda').sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(it=>{
    const k=it.spv+'|'+it.fecha.slice(0,7); const u=usados[k]||(usados[k]=new Set());
    const lista=pool[k]||(pool[k]=sugeridosRecupero(it,200));

}

    .filter(Boolean).sort((a,b)=>a.r.mes<b.r.mes?-1:a.r.mes>b.r.mes?1:(volPrevio(b.c.t||[])-volPrevio(a.c.t||[]))).slice(0,lim||8);
}

function infoCli(c,m){ const f=flags(c,'CVZA'), fn=flags(c,'NABS'); return `${esc(c.pv)} · visita ${esc(c.vis)} · ${esc(c.loc)} · Cerveza: ${horizonteLab(f)} · NABs: ${horizonteLab(fn)}${m?` · <b>motivo BEES:</b> ${esc(m.motivo.toLowerCase())} (${mesLab(m.mes)}) “${esc(m.resp)}”`:' · sin motivo relevado'}`; }
async function guardarVisita(vi){
  if(!D.api){ if(!vi.id) vi.id='L'+Date.now(); const i=D.visitas.findIndex(x=>x.id===vi.id); if(i>=0) D.visitas[i]=vi; else D.visitas.push(vi); lsSet('gcnc_visitas_local',D.visitas); return; }
  const r=await fetch(D.api,{method:'POST',body:JSON.stringify({action:'guardarVisita',visita:vi})}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'error de la planilla');
  const i=D.visitas.findIndex(x=>x.id===j.visita.id); if(i>=0) D.visitas[i]=j.visita; else D.visitas.push(j.visita);
}
async function borrarVisita(id){
  if(!D.api){ D.visitas=D.visitas.filter(x=>x.id!==id); lsSet('gcnc_visitas_local',D.visitas); return; }
  await fetch(D.api,{method:'POST',body:JSON.stringify({action:'borrarVisita',id})}); D.visitas=D.visitas.filter(x=>x.id!==id); toast('Visita borrada');
}

let MAP=null, LAYER=null; const MP={hz:'cnc', acum:false};
function rMapa(){
  const v=$('#v-mapa'); const un=S.un;

  const spvs=[...new Set(D.data.clientes.map(c=>c.spv))].sort().filter(x=>!locked||x===S.spv);
  const pvs=[...new Set(D.data.clientes.filter(c=>!S.spv||c.spv===S.spv).map(c=>c.pv))].sort();
  $('#mpFil').innerHTML=`<div class="f"><label>Negocio</label><div class="seg" id="mpUn">${['TOTAL','CVZA','NABS'].map(u=>`<button type="button" data-v="${u}" aria-pressed="${S.un===u}">${UNS[u].lab}</button>`).join('')}</div></div>
    <div class="f"><label for="mpSpv">Supervisor</label><select id="mpSpv" ${locked?'disabled':''}>${locked?'':'<option value="">Todos</option>'}${spvs.map(x=>`<option ${x===S.spv?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="f"><label for="mpPv">Promotor</label><select id="mpPv"><option value="">Todos</option>${pvs.map(x=>`<option ${x===S.pv?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    ${S.spv||S.pv||S.un!=='TOTAL'?'<button type="button" class="btn sm" id="mpClr">Quitar filtros</button>':''}`;
  const sync=()=>{ const fs=$('#fSpv'); if(fs&&!fs.disabled) fs.value=S.spv; fillPv(); document.querySelectorAll('#fUn button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===S.un)); render(); };
  document.querySelectorAll('#mpUn button').forEach(b=>b.onclick=()=>{ S.un=b.dataset.v; sync(); });
  $('#mpSpv').onchange=e=>{ S.spv=e.target.value; S.pv=''; sync(); };
  $('#mpPv').onchange=e=>{ S.pv=e.target.value; sync(); };
  const clr=$('#mpClr'); if(clr) clr.onclick=()=>{ S.un='TOTAL'; if(!locked) S.spv=''; S.pv=''; sync(); };
  $('#mpLeg').innerHTML=legend([['3 a 5 meses','--h1'],['6 a 11 meses','--h2'],['12 meses o más','--h3'],['Último mes','--s0']]);
  if(typeof L==='undefined'){ $('#map').innerHTML='<p class="hint" style="padding:16px">No se pudo cargar el mapa.</p>'; return; }
  if(!MAP){ MAP=L.map('map',{scrollWheelZoom:false}).setView([-32.93,-68.78],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP); }
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const cs=clientesFiltrados().map(c=>[c,flags(c,un)]).filter(([c,f])=>f&&c.geo);
  $('#mpBar').innerHTML=hzBar('mpHzBar', MP.hz, MP.acum, k=>cs.filter(([,f])=>enHz(f,k,MP.acum)).length, [['u1','Sin compra el último mes']]);
  bindHzBar('mpHzBar', MP, rMapa);
  const pts=cs.filter(([,f])=>enHz(f,MP.hz,MP.acum));
  const col=f=>cssv(f.bucket===3?'--h3':f.bucket===2?'--h2':f.bucket===1?'--h1':'--s0');
  pts.forEach(([c,f])=>{ L.circleMarker(c.geo,{radius:6,color:cssv('--panel'),weight:1.5,fillColor:col(f),fillOpacity:.95}).bindPopup(`<b>${esc(c.rs)}</b> #${c.cod}<br>${esc(c.dom)}<br>${esc(c.pv)} (${esc(c.spv)}) · visita ${esc(c.vis)}<br>${UNS[un].lab}: ${horizonteLab(f)} · ${f.nunca?'sin compras':f.meses+' meses sin compra'}${botonesMaps(c)}`).addTo(LAYER); });
  $('#mpCount').textContent=pts.length+' clientes en el mapa · '+UNS[un].lab+(S.spv?' · '+S.spv:'')+(S.pv?' · '+S.pv:'');
  if(pts.length){ MAP.fitBounds(L.latLngBounds(pts.map(p=>p[0].geo)).pad(.08)); }
  setTimeout(()=>MAP.invalidateSize(),60);
}

function urlIr(c){ return c.geo ? `https://www.google.com/maps/dir/?api=1&destination=${c.geo[0]},${c.geo[1]}&travelmode=driving` : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((c.dom||'')+', '+(c.loc||'')+', Mendoza')}`; }
function urlVer(c){ return c.geo ? `https://www.google.com/maps/search/?api=1&query=${c.geo[0]},${c.geo[1]}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((c.dom||'')+', '+(c.loc||'')+', Mendoza')}`; }
function botonesMaps(c){ return `<div class="mapbtns"><a class="btn sm primary" href="${urlIr(c)}" target="_blank" rel="noopener">🧭 Ir</a><a class="btn sm" href="${urlVer(c)}" target="_blank" rel="noopener">Ver en Maps</a><button type="button" class="btn sm" onclick="fichaCliente(${c.cod})">Ficha</button></div>`; }
