:root{
  color-scheme: light;
  --paper:#F5F1E8; --panel:#FCFAF5; --panel-2:#EFE9DC; --rule:#E2D9C7; --rule-2:#CFC4AE;
  --ink:#1D1A15; --ink-2:#554E43; --ink-3:#877F71;
  --accent:#1F4E79; --accent-soft:#DCE6F0; --amber:#A8660C; --amber-soft:#F6E7CC;
  --good:#2E7D32; --good-soft:#DDEEDB; --bad:#B8322A; --bad-soft:#F6DCD8; --warn:#B7791F; --warn-soft:#F7EBD3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#9C9486;
  --h1:#F0C987; --h2:#D98A2B; --h3:#8F4A0E;
  --grid:rgba(29,26,21,.08);
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#15130F; --panel:#1D1A15; --panel-2:#26221B; --rule:#322D24; --rule-2:#473F32;
    --ink:#F1ECE2; --ink-2:#C2B9A8; --ink-3:#8E8676;
    --accent:#86B4E3; --accent-soft:#1E2E3F; --amber:#E0A84A; --amber-soft:#3A2C14;
    --good:#6CC070; --good-soft:#1B3020; --bad:#EE7B72; --bad-soft:#3D1D1A; --warn:#E0A84A; --warn-soft:#3A2C14;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7D766A;
    --h1:#6B4515; --h2:#B8701F; --h3:#F0B45E;
    --grid:rgba(241,236,226,.08);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#15130F; --panel:#1D1A15; --panel-2:#26221B; --rule:#322D24; --rule-2:#473F32;
  --ink:#F1ECE2; --ink-2:#C2B9A8; --ink-3:#8E8676;
  --accent:#86B4E3; --accent-soft:#1E2E3F; --amber:#E0A84A; --amber-soft:#3A2C14;
  --good:#6CC070; --good-soft:#1B3020; --bad:#EE7B72; --bad-soft:#3D1D1A; --warn:#E0A84A; --warn-soft:#3A2C14;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7D766A;
  --h1:#6B4515; --h2:#B8701F; --h3:#F0B45E;
  --grid:rgba(241,236,226,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-top:18px}
.brand h1{font-size:clamp(22px,2.6vw,30px);line-height:1.1}
.brand .code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:middle;letter-spacing:.04em}
.brand .sub{color:var(--ink-3);font-size:12px;font-family:var(--f-mono)}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;padding:12px 0 10px;align-items:end}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.f select,.f input,.f textarea{background:var(--panel);border:1px solid var(--rule-2);border-radius:6px;padding:6px 9px;height:34px;max-width:100%}
.f select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 15px,calc(100% - 9px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.f textarea{height:auto;min-height:64px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;height:34px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:0 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--rule-2);background:var(--panel);border-radius:6px;height:34px;padding:0 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

main{padding-top:22px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sec-h h2{font-size:21px}
.sec-h p{margin:0;color:var(--ink-2);max-width:78ch}
.hint{color:var(--ink-3);font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{font-size:16px;margin-bottom:2px}
.panel .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--panel-2);color:var(--ink-2)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;padding:12px 0;border-top:1px solid var(--rule)}
.check:first-of-type{border-top:0}
.check .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.check .ic.ok{background:var(--good-soft);color:var(--good)}
.check .ic.warn{background:var(--warn-soft);color:var(--warn)}
.check .ic.bad{background:var(--bad-soft);color:var(--bad)}
.check b{display:block}
.check p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.check .go{font-size:12.5px;white-space:nowrap}

.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--panel-2);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.sub td{background:var(--panel-2);font-weight:700}
tr.tot td{background:var(--amber-soft);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.txt{white-space:normal;min-width:220px;max-width:420px}
.heat{border-radius:4px;padding:1px 6px;display:inline-block;min-width:38px;text-align:right}
.spark{display:inline-flex;align-items:flex-end;gap:1px;height:18px;vertical-align:middle}
.spark i{display:block;width:4px;background:var(--s1);border-radius:1px 1px 0 0;min-height:1px}
.spark i.z{background:var(--rule-2);height:2px!important}
.spark i.cur{outline:1px solid var(--ink-3)}

.chart{position:relative;height:280px}
.chart.tall{height:420px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.bar-h{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.bar-h .track{height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden;display:flex;gap:2px}
.bar-h .track i{display:block;height:100%}

.note{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}
.note.warn{background:var(--warn-soft)}
.note b{font-weight:700}
details.sop{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 16px}
details.sop summary{cursor:pointer;font-weight:600}
details.sop ol{margin:8px 0 4px;padding-left:20px;color:var(--ink-2)}
details.sop li{margin:3px 0}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;text-align:center;padding:2px 0}
.cal .d{min-height:86px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .d.out{opacity:.45}
.cal .d.hoy{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal .d .dn{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.cal .ev{font-size:11px;line-height:1.25;padding:2px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--panel-2)}
.cal .ev.real{background:var(--good-soft);color:var(--good)}
.cal .ev.prog{background:var(--accent-soft);color:var(--accent)}
.cal .ev.canc{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
@media (max-width:640px){ .cal .d{min-height:56px} .cal .ev{font-size:0;height:6px;padding:0} }

.pda-sec{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start}
.evid{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.evid button{border:1px solid var(--rule-2);border-radius:8px;padding:3px;background:var(--panel-2);cursor:zoom-in;display:block;width:132px}
.evid button:hover{border-color:var(--ink-3)}
.evid img{display:block;width:100%;height:150px;object-fit:cover;object-position:top;border-radius:5px}
.evid.vacia{border:1px dashed var(--rule-2);border-radius:8px;padding:10px;min-height:80px;width:132px;font-size:11.5px}
@media (max-width:640px){.pda-sec{grid-template-columns:1fr}.evid{flex-direction:row;flex-wrap:wrap}}
.prog{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}

dialog{border:1px solid var(--rule-2);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px 20px;overflow:auto;max-height:calc(100vh - 40px)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 12px}
.fgrid .full{grid-column:1/-1}
.mk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
#map{height:560px;border-radius:10px;border:1px solid var(--rule);z-index:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-weight:600;z-index:3000}
body.embed .brand{padding-top:10px}
@media print{.top{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* ====================== estado y utilidades ====================== */
const D = { data:null, visitas:[], api:'' };
const S = { un:'TOTAL', spv:'', pv:'', crit:'aud', tab:'resumen', user:null };
const MES_L = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MES_LL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const UNS = { TOTAL:{k:'t',tx:'t',lab:'Total',col:'--s7'}, CVZA:{k:'c',tx:'c',lab:'Cerveza',col:'--s4'}, NABS:{k:'n',tx:'n',lab:'NABs',col:'--s1'} };
const MOT_COL = { 'PRECIO NO COMPETITIVOS':'--s1', 'DIFERENCIA DE PRECIOS':'--s2', 'COMPRA EN MAYORISTA':'--s3' };
const PER_LAB = {0:'Sin visita',1:'Semanal (1)',2:'Quincenal (0,50)',3:'Cada 3 semanas (0,33)',4:'Mensual (0,25)'};
const USERS = { 'guillen2026':{name:'GUILLEN IGNACIO',spv:'GUILLEN',scope:'own'}, 'sans2026':{name:'SANS LUCAS',spv:'SANS',scope:'own'}, 'jefe2026':{name:'JEFE DE VENTAS',spv:'',scope:'all'} };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR');
const n0 = x => x==null||isNaN(x) ? '–' : nf.format(Math.round(x));
const n1 = x => x==null||isNaN(x) ? '–' : x.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const n2 = x => x==null||isNaN(x) ? '–' : x.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc = (x,d=0) => x==null||!isFinite(x) ? '–' : (x*100).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})+' %';
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mesLab = ym => { if(!ym) return ''; const [y,m]=ym.split('-'); return MES_L[+m-1]+' '+y.slice(2); };
const mesLL = ym => { if(!ym) return ''; const [y,m]=ym.split('-'); return MES_LL[+m-1]+' '+y; };
const fDate = iso => { if(!iso) return '–'; const [y,m,d]=iso.slice(0,10).split('-'); return d+'/'+m+'/'+y.slice(2); };
function hoyISO(){ const d=new Date(Date.now()-3*3600e3); return d.toISOString().slice(0,10); }
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function sumaMes(ym,k){ let [y,m]=ym.split('-').map(Number); m=m-1+k; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ====================== lógica de horizontes ====================== */
let M=[], MI=0;
function serie(c,un){ return c[UNS[un||S.un].k] || null; }
function elegible(c,k){ if(S.crit==='excel') return true; if(!c.alta) return true; const ini=M[MI-k]; return !ini || c.alta.slice(0,7)<=ini; }
function excluidoTexto(c,un){ return S.crit==='excel' && (c.tx||'').includes(UNS[un||S.un].tx); }
function sinCompra(s,k,hasta){ const h = hasta==null?MI:hasta; for(let j=1;j<=k;j++){ const i=h-j; if(i<0) return false; if(s[i]>0) return false; } return true; }
function flags(c,un){
  const s=serie(c,un); if(!s) return null;
  const tx=excluidoTexto(c,un);
  const f={ ma: !tx && s[MI]<=0 };
  [['u1',1],['u2',2],['u3',3],['u6',6],['u9',9],['u12',12]].forEach(([n,k])=>{ f[n]= !tx && sinCompra(s,k) && elegible(c,k); });
  let m=0; for(let i=MI-1;i>=0 && s[i]<=0;i--) m++; f.meses = m>=MI ? MI : m; f.nunca = m>=MI;
  f.bucket = f.u12 ? 3 : f.u6 ? 2 : f.u3 ? 1 : 0;
  return f;
}
function horizonteLab(f){ return !f ? '–' : f.u12 ? 'U12M' : f.u6 ? 'U6M' : f.u3 ? 'U3M' : (f.u1 ? 'Últ. mes' : 'Compra'); }
function volPrevio(s){ let t=0,n=0; for(let i=0;i<MI;i++){ if(s[i]>0){ t+=s[i]; n++; } } return n? t/n : 0; }
function clientesFiltrados(){
  return D.data.clientes.filter(c => (!S.spv || c.spv===S.spv) && (!S.pv || c.pv===S.pv));
}
function ultimoMotivo(cod){ return MOT_IDX[cod] || null; }
let MOT_IDX = {};

/* ====================== carga ====================== */
async function cargar(){
  const r = await fetch('data.json',{cache:'no-store'});
  D.data = await r.json();
  M = D.data.meta.meses; MI = M.length-1;
  D.api = D.data.meta.api || '';
  // índice de último motivo por cliente (UN > TOTAL)
  const push=(b,src)=>b.regs.forEach(r=>{ const prev=MOT_IDX[r.cod]; if(!prev || prev.fecha<=r.fecha) MOT_IDX[r.cod]={...r, mes:b.mes, src}; });
  D.data.motivos.total.forEach(b=>push(b,'TOTAL'));
  D.data.motivos.un.forEach(b=>push(b,'UN'));
  D.data.clientes.forEach(c=>CLI[c.cod]=c);
  initUser(); initFiltros();
  $('#subTitle').textContent = `Datos al ${D.data.meta.generado} · mes en curso ${mesLL(D.data.meta.mesActual)} (parcial) · U3M = sin compra en ${mesLab(M[MI-3])}, ${mesLab(M[MI-2])} y ${mesLab(M[MI-1])}`;
  await cargarVisitas();
}
async function cargarVisitas(){
  if(!D.api){ D.visitas = lsGet('gcnc_visitas_local',[]); D.visitasLocal=true; return; }
  try{
    const r = await fetch(D.api+'?action=visitas',{cache:'no-store'});
    const j = await r.json(); D.visitas = j.visitas||[]; D.visitasLocal=false;
  }catch(e){ D.visitas = lsGet('gcnc_visitas_local',[]); D.visitasLocal=true; D.visitasError=true; }
}

function initUser(){
  const p = new URLSearchParams(location.search);
  if(p.get('embed')) document.body.classList.add('embed');
  const spv = (p.get('spv')||'').toUpperCase();
  const scope = p.get('scope')||''; const rol = p.get('rol')||'';
  if(spv && scope==='own'){ S.user={name:spv, spv:spv.split(' ')[0], scope:'own'}; }
  else if(scope==='all' && rol && rol!=='liderbb'){ S.user={name: rol==='gerencia'?'GERENCIA':'JEFE DE VENTAS', spv:'', scope:'all', lectura: rol==='gerencia'}; }
  else { const u=(()=>{try{return JSON.parse(sessionStorage.getItem('gcncUser')||'null');}catch(e){return null;}})(); if(u) S.user=u; }
  if(S.user && S.user.scope==='own') S.spv = S.user.spv;
  pintarUser();
}
function pintarUser(){
  $('#userTag').innerHTML = S.user ? `👤 ${esc(S.user.name)}${!new URLSearchParams(location.search).get('embed')?' · <a href="#" id="logout">salir</a>':''}` : `<a href="#" id="loginLink">Ingresar como supervisor</a>`;
  const ll=$('#loginLink'); if(ll) ll.onclick=e=>{e.preventDefault(); abrirLogin();};
  const lo=$('#logout'); if(lo) lo.onclick=e=>{e.preventDefault(); S.user=null; try{sessionStorage.removeItem('gcncUser');}catch(_){} S.spv=''; initFiltros(); pintarUser(); render();};
}
function abrirLogin(){
  const d=$('#dlgLogin'); $('#loginErr').textContent=''; $('#loginPw').value=''; d.showModal();
  $('#loginCancel').onclick=()=>d.close();
  $('#loginForm').onsubmit=e=>{ e.preventDefault(); const u=USERS[$('#loginPw').value.trim().toLowerCase()]; if(!u){ $('#loginErr').textContent='Contraseña incorrecta.'; return; }
    S.user=u; try{sessionStorage.setItem('gcncUser',JSON.stringify(u));}catch(_){} if(u.scope==='own') S.spv=u.spv; d.close(); initFiltros(); pintarUser(); render(); };
}

function initFiltros(){
  const spvs=[...new Set(D.data.clientes.map(c=>c.spv))].sort();
  const fs=$('#fSpv');
  const locked = S.user && S.user.scope==='own';
  fs.innerHTML = (locked?'':'<option value="">Todos</option>') + spvs.filter(s=>!locked||s===S.spv).map(s=>`<option ${s===S.spv?'selected':''}>${esc(s)}</option>`).join('');
  fs.disabled = locked;
  fillPv();
  fs.onchange=()=>{ S.spv=fs.value; S.pv=''; fillPv(); render(); };
  $('#fPv').onchange=()=>{ S.pv=$('#fPv').value; render(); };
  $('#fCrit').value=S.crit; $('#fCrit').onchange=()=>{ S.crit=$('#fCrit').value; render(); };
  document.querySelectorAll('#fUn button').forEach(b=>b.onclick=()=>{ S.un=b.dataset.v; document.querySelectorAll('#fUn button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
  document.querySelectorAll('#tabs .tab').forEach(t=>t.onclick=()=>irTab(t.dataset.t));
}
function fillPv(){
  const pvs=[...new Set(D.data.clientes.filter(c=>!S.spv||c.spv===S.spv).map(c=>c.pv))].sort();
  $('#fPv').innerHTML='<option value="">Todos</option>'+pvs.map(p=>`<option ${p===S.pv?'selected':''}>${esc(p)}</option>`).join('');
}
function irTab(t){
  S.tab=t; document.querySelectorAll('#tabs .tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.t===t));
  document.querySelectorAll('main > .view').forEach(v=>v.hidden = v.id!=='v-'+t);
  if(location.hash.slice(1)!==t) history.replaceState(null,'','#'+t);
  render(); window.scrollTo({top:0});
}

/* ====================== charts ====================== */
const CH = {};
function chart(id,cfg){
  if(CH[id]) CH[id].destroy();
  const el=document.getElementById(id); if(!el) return;
  Chart.defaults.font.family = cssv('--f-body') || 'system-ui';
  Chart.defaults.color = cssv('--ink-2');
  Chart.defaults.borderColor = cssv('--grid');
  const o=cfg.options||{}; const pl=o.plugins||{};
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}}, o);
  cfg.options.plugins = Object.assign({}, pl, {legend:{display:false}, tooltip:Object.assign({backgroundColor:cssv('--ink'), titleColor:cssv('--paper'), bodyColor:cssv('--paper'), padding:10, cornerRadius:6}, pl.tooltip||{})});
  CH[id] = new Chart(el, cfg);
}
function legend(items){ return `<div class="legend">${items.map(([l,c])=>`<span><i class="dot" style="background:var(${c})"></i>${esc(l)}</span>`).join('')}</div>`; }
function heatBg(x, max, varName){ if(!x||!max) return ''; const a=Math.min(1,x/max); return `background:color-mix(in srgb, var(${varName||'--h2'}) ${Math.round(a*55)}%, transparent)`; }
function spark(s){
  const mx=Math.max(...s.map(v=>v>0?v:0),0.0001);
  return `<span class="spark" title="${s.map((v,i)=>mesLab(M[i])+': '+n2(v)).join(' · ')}">`+s.map((v,i)=>`<i class="${v>0?'':'z'} ${i===MI?'cur':''}" style="height:${v>0?Math.max(2,Math.round(v/mx*18)):2}px"></i>`).join('')+'</span>';
}

/* ====================== render ====================== */
function render(){
  if(!D.data) return;
  const f={resumen:rResumen, horizonte:rHorizonte, clientes:rClientes, compradores:rCompradores, motivos:rMotivos, pda:rPda, visitas:rVisitas, mapa:rMapa}[S.tab];
  f && f();
  enviarAlto();
}
function enviarAlto(){ if(window.parent!==window) setTimeout(()=>{ try{ window.parent.postMessage({gcncAlto: document.documentElement.scrollHeight},'*'); }catch(e){} },120); }
window.addEventListener('resize', enviarAlto);

/* ---------- agregados por promotor ---------- */
function tablaHorizonte(un){
  const rows={}; const tot={};
  clientesFiltrados().forEach(c=>{
    const f=flags(c,un); if(!f) return;
    const key=c.spv+'|'+c.pv;
    const r = rows[key] || (rows[key]={spv:c.spv,pv:c.pv,cart:0,ma:0,u1:0,u2:0,u3:0,u6:0,u9:0,u12:0,compra:0});
    r.cart++; ['ma','u1','u2','u3','u6','u9','u12'].forEach(k=>{ if(f[k]) r[k]++; }); if(serie(c,un)[MI]>0) r.compra++;
  });
  return Object.values(rows).sort((a,b)=>a.spv.localeCompare(b.spv)||a.pv.localeCompare(b.pv));
}
function sumRows(rs,label){ const o={pv:label,cart:0,ma:0,u1:0,u2:0,u3:0,u6:0,u9:0,u12:0,compra:0}; rs.forEach(r=>Object.keys(o).forEach(k=>{ if(k!=='pv') o[k]+=r[k]; })); return o; }
function totalesUn(un){ const rs=tablaHorizonte(un); return sumRows(rs,'ZUPPA'); }

/* ====================== RESUMEN ====================== */
function rResumen(){
  const v=$('#v-resumen');
  const T={}; ['TOTAL','CVZA','NABS'].forEach(u=>T[u]=totalesUn(u));
  const t=T[S.un];
  // frecuencia U12M (sobre total: clientes que no compran nada hace 12 meses)
  const u12=clientesFiltrados().filter(c=>{const f=flags(c,'TOTAL'); return f&&f.u12;});
  const frecOk=u12.filter(c=>c.per===4).length, frecQ=u12.filter(c=>c.per===2).length;
  const frecMal=u12.length-frecOk-frecQ;
  // BEES Force
  const mt=D.data.motivos.total.filter(b=>!b.pendiente), mu=D.data.motivos.un;
  const mesesRel=[...new Set([...mt,...mu].filter(b=>b.regs.length).map(b=>b.mes))].sort();
  const pend=D.data.motivos.total.filter(b=>b.pendiente);
  const relUnU = mu.reduce((a,b)=>a+b.regs.filter(enFiltro).length,0);
  const relTot = mt.reduce((a,b)=>a+b.regs.filter(enFiltro).length,0);
  // PDA
  const pdaMeses=D.data.pda.total.map(p=>p.label.toLowerCase());
  const pdaSinAccion=[...D.data.pda.un].reduce((a,p)=>a+[...p.cerveza,...p.nabs].filter(x=>!x.accion).length,0);
  const pdaNoReal=D.data.pda.total.reduce((a,p)=>a+[...p.cerveza,...p.nabs].filter(x=>/NO REALIZADO/.test(x.status)).length,0);
  // visitas SPV mes

/* ====================== PDA ====================== */
const PD={base:'TOTAL'};
function rPda(){
  const v=$('#v-pda');

  // recuperados calculados para comparar (relevamiento del mes anterior)
  const relBl = PD.base==='TOTAL'? D.data.motivos.total : D.data.motivos.un;
  v.innerHTML=`
  <div class="sec-h"><h2>Planes de acción (PDA) por motivo</h2><p>Cada PDA responde a los motivos relevados el mes anterior: el PDA de mayo trabaja sobre el relevamiento de abril. Se muestran la acción, el estado, la fecha límite y los clientes recuperados que informa la hoja, junto al recupero calculado con la facturación.</p></div>
  <div class="filters" style="padding:0"><div class="f"><label>Base</label><div class="seg" id="pdBase"><button type="button" data-v="TOTAL" aria-pressed="${PD.base==='TOTAL'}">Total</button><button type="button" data-v="UN" aria-pressed="${PD.base==='UN'}">Por negocio</button></div></div></div>
  ${P.slice().reverse().map(p=>{
    const prev=sumaMes(p.mes,-1); const rb=relBl.find(b=>b.mes===prev);
    const regs = rb? rb.regs.filter(enFiltro):[];
    const recC = regs.filter(r=>{const c=CLI[r.cod]; if(!c) return false; const i=M.indexOf(p.mes); return i>=0 && i<=MI && (c.c||[])[i]>0;}).length;
    const recN = regs.filter(r=>{const c=CLI[r.cod]; if(!c) return false; const i=M.indexOf(p.mes); return i>=0 && i<=MI && (c.n||[])[i]>0;}).length;
    const recs=p.recuperados.filter(x=>(!S.pv||x.pv===S.pv)&&(!S.spv||x.pv===S.spv||spvDe(x.pv)===S.spv||x.pv==='ZUPPA'&&!S.pv&&!S.spv));
    return `<div class="panel"><div class="ph"><h3>PDA ${mesLL(p.mes)}</h3><span class="hint">sobre el relevamiento de ${mesLL(prev)}${rb?' · '+regs.length+' clientes relevados':''}</span></div>
    ${['cerveza','nabs'].map(sec=>p[sec].length?`<p class="hint" style="margin:6px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">PDA ${sec==='cerveza'?'Cerveza':'NABs'}</p>
      <div class="pda-sec">${evid(p.mes,sec)}<div class="tw"><table><thead><tr><th>Motivo</th><th class="n">Clientes</th><th>Acción</th><th>Estado</th><th>Fecha límite</th><th>Responsable</th></tr></thead><tbody>
      ${p[sec].map(x=>`<tr><td><span class="mk"><i class="dot" style="background:var(${MOT_COL[x.motivo]||'--s0'})"></i>${esc(x.motivo.toLowerCase())}</span></td><td class="n">${x.clientes??'–'}</td><td class="txt">${x.accion?esc(x.accion):'<span class="chip warn">sin acción cargada</span>'}</td><td>${stChip(x.status)}</td><td>${fDate(x.deadline)}</td><td>${esc(x.resp)}</td></tr>`).join('')}
      </tbody></table></div></div>`:'').join('')}
    ${recs.length?`<p class="hint" style="margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">Clientes recuperados (informado en la hoja)</p>
      <div class="tw"><table><thead><tr><th>Promotor</th><th class="n">Relevados</th><th class="n">Real CVZA</th><th class="n">Real NABs</th><th class="n">Avance CVZA</th><th class="n">Avance NABs</th></tr></thead><tbody>
      ${recs.map(x=>{const base=x.cant!=null?x.cant:((x.nN||0)+(x.nC||0)); const bc=x.cant!=null?x.cant:x.nC, bn=x.cant!=null?x.cant:x.nN; return `<tr class="${x.total?(x.pv==='ZUPPA'?'tot':'sub'):''}"><td>${esc(x.pv)}</td><td class="n">${base||'–'}</td><td class="n">${x.realC??'–'}</td><td class="n">${x.realN??'–'}</td><td class="n">${bc&&x.realC!=null?pc(x.realC/bc):'–'}</td><td class="n">${bn&&x.realN!=null?pc(x.realN/bn):'–'}</td></tr>`;}).join('')}
      </tbody></table></div>`:''}
    ${rb&&M.indexOf(p.mes)>=0?`<p class="hint" style="margin:8px 0 0">Calculado con la facturación: de los ${regs.length} relevados en ${mesLab(prev)}, ${recC} compraron cerveza y ${recN} NABs en ${mesLab(p.mes)}${p.mes===M[MI]?' (mes en curso)':''}.</p>`:''}
    </div>`;}).join('')}`;
  v.querySelectorAll('#pdBase button').forEach(b=>b.onclick=()=>{PD.base=b.dataset.v; rPda();});
  v.querySelectorAll('.evid button').forEach(b=>b.onclick=()=>verImagen(b.dataset.src, b.dataset.cap));
}

function evid(mes,sec){
  const ims=((D.data.evidencias||{})[mes]||{})[sec]||[];
  const cap=`Acción ${sec==='cerveza'?'Cerveza':'NABs'} · ${mesLL(mes)}`;

  return `<div class="evid">${ims.map((src,i)=>`<button type="button" data-src="${esc(src)}" data-cap="${esc(cap)}" aria-label="Ver imagen de la ${esc(cap)}"><img src="${esc(src)}" alt="${esc(cap)}${ims.length>1?' ('+(i+1)+')':''}" loading="lazy"></button>`).join('')}<span class="hint">Evidencia</span></div>`;
}
function verImagen(src,cap){

    return {c,m,un:(fc&&fc.u3)&&(fn&&fn.u3)?'Cerveza y NABs':(fc&&fc.u3)?'Cerveza':'NABs',vol:volPrevio(c.c||[])+volPrevio(c.n||[]),f:fc&&fc.u3?fc:fn}; }).filter(Boolean).sort((a,b)=>b.vol-a.vol).slice(0,25);
  // efectividad: visitas realizadas y si el cliente compró después

  v.innerHTML=`
  <div class="sec-h"><h2>Visitas de supervisores a CNC con motivo</h2><p>Los supervisores destinan parte de sus horas en calle a visitar clientes con motivo de no compra para profundizar la causa y mejorar la experiencia. Objetivo: ${obj} visitas realizadas por supervisor por mes.</p></div>

    <div class="kpi"><span class="l">Compraron en los meses siguientes</span><span class="v">${efect.length?pc(efect.filter(Boolean).length/efect.length):'–'}</span><span class="d">${efect.length?efect.filter(Boolean).length+' de '+efect.length+' visitas de meses cerrados':'se mide desde el mes siguiente a la visita'}</span></div>

const CAUSAS=['Precio / condiciones comerciales','Compra en mayorista / feria','Problema de servicio o entrega','Falta de EDF o EDF en mal estado','Deuda / cuenta corriente','Baja rotación del producto','Cambio de dueño o de rubro','Local cerrado temporalmente','Cerró definitivamente','Otro'];
function abrirVisita(x){

  <div class="fgrid">
    <div class="f full"><label for="vCli">Cliente (código o nombre)</label><input id="vCli" list="vCliList" value="${c?esc(c.cod+' · '+c.rs):''}" ${ro?'disabled':''} required><datalist id="vCliList"></datalist></div>
    <div class="f full hint" id="vCliInfo">${c?infoCli(c,m):'Escribí al menos 3 letras o el código.'}</div>
    <div class="f"><label for="vSpv">Supervisor</label><select id="vSpv" ${ro||(S.user&&S.user.scope==='own')?'disabled':''}>${['GUILLEN','SANS'].map(s=>`<option ${s===spvDef?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f"><label for="vFecha">Fecha</label><input id="vFecha" type="date" value="${esc(x.fecha||hoyISO())}" ${ro?'disabled':''} required></div>
    <div class="f"><label for="vEstado">Estado</label><select id="vEstado" ${ro?'disabled':''}>${['Programada','Realizada','Cancelada'].map(s=>`<option ${s===x.estado?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f"><label for="vCausa">Causa que observó</label><select id="vCausa" ${ro?'disabled':''}><option value="">Elegí…</option>${CAUSAS.map(s=>`<option ${s===x.causa?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f full"><label for="vNota">Qué notó en la visita</label><textarea id="vNota" ${ro?'disabled':''} placeholder="Qué dijo el cliente, cómo está el local, exhibición, competencia, precios que vio…">${esc(x.nota||'')}</textarea></div>
    <div class="f"><label for="vExp">Experiencia del cliente con Zuppa (1 a 5)</label><select id="vExp" ${ro?'disabled':''}><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${String(n)===String(x.experiencia)?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="f"><label for="vComp">Competencia / precio visto</label><input id="vComp" value="${esc(x.competencia||'')}" ${ro?'disabled':''} placeholder="Ej.: mayorista X, lata 473 a $…"></div>
    <div class="f full"><label for="vPlan">Plan de acción acordado</label><textarea id="vPlan" ${ro?'disabled':''} placeholder="Acción concreta, con quién y para cuándo">${esc(x.plan||'')}</textarea></div>
    <div class="f"><label for="vResp">Responsable</label><input id="vResp" value="${esc(x.responsable||'')}" ${ro?'disabled':''}></div>
    <div class="f"><label for="vCompr">Fecha compromiso</label><input id="vCompr" type="date" value="${esc(x.compromiso||'')}" ${ro?'disabled':''}></div>
    <div class="f"><label for="vRes">Resultado</label><select id="vRes" ${ro?'disabled':''}>${['','Pendiente','Volvió a comprar','No volvió a comprar','Cliente cerrado'].map(s=>`<option ${s===(x.resultado||'')?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f"><label for="vProx">Próximo seguimiento</label><input id="vProx" type="date" value="${esc(x.proximo||'')}" ${ro?'disabled':''}></div>
  </div>
  <div class="hint" id="vErr"></div>
  ${ro?'':`<div class="row">${edit?'<button type="button" class="btn danger" id="vDel">Borrar</button><span class="hint" id="vDelConf"></span>':''}<span class="sp"></span><button class="btn primary" id="vSave">Guardar visita</button></div>`}
  </form>`;
  d.showModal();
  $('#vxClose').onclick=()=>d.close();
  let sel=c;
  const inp=$('#vCli');
  inp.addEventListener('input',()=>{ const q=inp.value.trim().toUpperCase(); const dl=$('#vCliList'); sel=null;
    const mm=/^(\d+)/.exec(q); if(mm && CLI[+mm[1]] && q.includes('·')) { sel=CLI[+mm[1]]; }
    if(q.length>=3||/^\d+$/.test(q)){ const base=D.data.clientes.filter(k=>(!S.user||S.user.scope!=='own'||k.spv===S.user.spv)); dl.innerHTML=base.filter(k=>String(k.cod).startsWith(q)||k.rs.toUpperCase().includes(q)).slice(0,30).map(k=>`<option value="${esc(k.cod+' · '+k.rs)}">`).join(''); }
    if(!sel && mm && CLI[+mm[1]] && String(CLI[+mm[1]].cod)===q) sel=CLI[+mm[1]];
    $('#vCliInfo').innerHTML = sel? infoCli(sel, ultimoMotivo(sel.cod)) : 'Elegí un cliente de la lista.';
  });
  const del=$('#vDel'); if(del){ let arm=false; del.onclick=async()=>{ if(!arm){ arm=true; del.textContent='Confirmar borrado'; $('#vDelConf').textContent='Tocá de nuevo para borrar.'; return; } await borrarVisita(x.id); d.close(); rVisitas(); }; }
  $('#fVis').onsubmit=async e=>{ e.preventDefault(); if(ro) return;
    if(!sel){ $('#vErr').textContent='Elegí un cliente de la lista (código · nombre).'; return; }
    const f=flags(sel,'CVZA'), fn=flags(sel,'NABS'); const mm=ultimoMotivo(sel.cod);
    const vi={ id:x.id||'', spv:$('#vSpv').value, fecha:$('#vFecha').value, estado:$('#vEstado').value, cod:String(sel.cod), cliente:sel.rs, pv:sel.pv,
      un: [(f&&f.u3)?'CVZA':'', (fn&&fn.u3)?'NABS':''].filter(Boolean).join(' + ') || 'Total', horizonte: horizonteLab(flags(sel,'TOTAL')), motivo: mm?mm.motivo:'',
      causa:$('#vCausa').value, nota:$('#vNota').value.trim(), experiencia:$('#vExp').value, competencia:$('#vComp').value.trim(), plan:$('#vPlan').value.trim(),
      responsable:$('#vResp').value.trim(), compromiso:$('#vCompr').value, resultado:$('#vRes').value, proximo:$('#vProx').value, creado:x.creado||'' };
    if(vi.estado==='Realizada' && !vi.nota){ $('#vErr').textContent='Para marcarla como realizada contá qué notaste en la visita.'; return; }
    $('#vSave').disabled=true; $('#vSave').textContent='Guardando…';
    try{ await guardarVisita(vi); d.close(); toast('Visita guardada'); rVisitas(); }
    catch(err){ $('#vErr').textContent='No se pudo guardar: '+err.message; $('#vSave').disabled=false; $('#vSave').textContent='Guardar visita'; }
  };
}
function infoCli(c,m){ const f=flags(c,'CVZA'), fn=flags(c,'NABS'); return `${esc(c.pv)} · visita ${esc(c.vis)} · ${esc(c.loc)} · Cerveza: ${horizonteLab(f)} · NABs: ${horizonteLab(fn)}${m?` · <b>motivo BEES:</b> ${esc(m.motivo.toLowerCase())} (${mesLab(m.mes)}) “${esc(m.resp)}”`:' · sin motivo relevado'}`; }
async function guardarVisita(vi){
  if(!D.api){ if(!vi.id) vi.id='L'+Date.now(); const i=D.visitas.findIndex(x=>x.id===vi.id); if(i>=0) D.visitas[i]=vi; else D.visitas.push(vi); lsSet('gcnc_visitas_local',D.visitas); return; }
  const r=await fetch(D.api,{method:'POST',body:JSON.stringify({action:'guardarVisita',visita:vi})}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'error de la planilla');
  const i=D.visitas.findIndex(x=>x.id===j.visita.id); if(i>=0) D.visitas[i]=j.visita; else D.visitas.push(j.visita);
}
async function borrarVisita(id){
  if(!D.api){ D.visitas=D.visitas.filter(x=>x.id!==id); lsSet('gcnc_visitas_local',D.visitas); return; }
  await fetch(D.api,{method:'POST',body:JSON.stringify({action:'borrarVisita',id})}); D.visitas=D.visitas.filter(x=>x.id!==id); toast('Visita borrada');
}

/* ====================== MAPA ====================== */
let MAP=null, LAYER=null; const MP={hz:'u3'};
function rMapa(){
  const v=$('#v-mapa'); const un=S.un;
  if(!v.dataset.ok){
    v.innerHTML=`<div class="sec-h"><h2>Mapa de clientes no compradores</h2><p>Color por antigüedad de la no compra. Tocá un punto para ver el cliente.</p></div>
    <div class="filters" style="padding:0"><div class="f"><label for="mpHz">Mostrar</label><select id="mpHz"><option value="u3">CNC U3M</option><option value="u6">CNC U6M</option><option value="u12">CNC U12M</option><option value="u1">Sin compra el último mes</option></select></div>
    <div id="mpLeg" style="align-self:center"></div><span class="hint" id="mpCount" style="align-self:center"></span></div>
    <div id="map" role="region" aria-label="Mapa de CNC"></div>`;
    v.dataset.ok=1; $('#mpHz').onchange=e=>{MP.hz=e.target.value; rMapa();};
  }
  $('#mpLeg').innerHTML=legend([['3 a 5 meses','--h1'],['6 a 11 meses','--h2'],['12 meses o más','--h3'],['Último mes','--s0']]);
  if(typeof L==='undefined'){ $('#map').innerHTML='<p class="hint" style="padding:16px">No se pudo cargar el mapa.</p>'; return; }
  if(!MAP){ MAP=L.map('map',{scrollWheelZoom:false}).setView([-32.93,-68.78],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP); }
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const pts=[]; clientesFiltrados().forEach(c=>{ if(!c.geo) return; const f=flags(c,un); if(!f||!f[MP.hz]) return; pts.push([c,f]); });
  const col=f=>cssv(f.bucket===3?'--h3':f.bucket===2?'--h2':f.bucket===1?'--h1':'--s0');
  pts.forEach(([c,f])=>{ L.circleMarker(c.geo,{radius:6,color:cssv('--panel'),weight:1.5,fillColor:col(f),fillOpacity:.95}).bindPopup(`<b>${esc(c.rs)}</b> #${c.cod}<br>${esc(c.dom)}<br>${esc(c.pv)} · visita ${esc(c.vis)}<br>${horizonteLab(f)} · ${f.nunca?'sin compras':f.meses+' meses sin compra'}`).addTo(LAYER); });
  $('#mpCount').textContent=pts.length+' clientes en el mapa';
  if(pts.length){ MAP.fitBounds(L.latLngBounds(pts.map(p=>p[0].geo)).pad(.08)); }
  setTimeout(()=>MAP.invalidateSize(),60);
}

/* ====================== arranque ====================== */
cargar().then(()=>{ D.data.clientes.forEach(c=>CLI[c.cod]=c); const h=location.hash.slice(1); if(h && document.querySelector(`#tabs [data-t="${h}"]`)) irTab(h); else render(); })
  .catch(e=>{ $('#v-resumen').innerHTML=`<div class="note warn"><b>No pude cargar data.json.</b> ${esc(e.message)}. Corré “Actualizar tablero en GitHub” desde la planilla.</div>`; });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(D.data && h!==S.tab && document.querySelector(`#tabs [data-t="${h}"]`)) irTab(h); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
</script>
</html>
